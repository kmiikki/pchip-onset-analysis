# analysis/onset-config.ini
#
# Human-editable per-experiment onset configuration.
# This file stores reviewed analysis decisions.
#
# Defaults used when this file is missing:
#   MGI onsets  = 2
#   FBRM onsets = 2
#
# Edit only the values after "=" unless you know what you are doing.

[MGI]
onsets = 2

[FBRM]
onsets = 2

[Notes]
comment = Initial default onset counts. Edit after review if this experiment needs different accepted onset counts.
